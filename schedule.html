<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Schedule — TravelVista</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Page Header -->
  <div class="page-header">
    <h1>Travel Schedule</h1>
    <p>Day-wise itinerary for all tour packages</p>
  </div>

  <!-- Schedule Section -->
  <section class="schedule-section">
    <div class="container">
      <div id="schedules-container">
        <!-- Rendered by booking.js -->
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <strong>TravelVista</strong> &copy; 2026 — Your trusted travel partner across India.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="auth.js"></script>
  <script src="navbar.js"></script>
  <script src="packages.js"></script>
  <script src="booking.js"></script>
  <script>
    const session = requireAuth();
    if (session) {
      injectNavbar('schedule');
      setupNavbar();
      renderSchedules();

      // Scroll to package if anchor is present in URL
      const hash = window.location.hash;
      if (hash) {
        setTimeout(() => {
          const target = document.querySelector(hash);
          if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 200);
      }
    }
  </script>
</body>
</html>
