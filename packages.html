<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tour Packages — TravelVista</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navbar -->
  <div id="navbar-placeholder"></div>

  <!-- Page Header -->
  <div class="page-header">
    <h1>Tour Packages</h1>
    <p>Choose from our curated collection of India's most stunning destinations</p>
  </div>

  <!-- Packages List -->
  <section style="padding:3rem 0;background:var(--bg-light);min-height:calc(100vh - 220px);">
    <div class="container">
      <div class="row g-4" id="packages-list">
        <!-- Rendered by packages.js -->
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <strong>TravelVista</strong> &copy; 2026 — Your trusted travel partner across India.
  </footer>

  <div class="toast-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="auth.js"></script>
  <script src="navbar.js"></script>
  <script src="packages.js"></script>
  <script>
    const session = requireAuth();
    if (session) {
      injectNavbar('packages');
      setupNavbar();
      renderPackagesList();
    }
  </script>
</body>
</html>
