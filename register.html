<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — TravelVista</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Auth Wrapper: Split Layout -->
  <div class="auth-wrapper">

    <!-- Left: Hero Image -->
    <div class="auth-left" style="background-image:url('https://images.unsplash.com/photo-1602216056096-3b40cc0c9944?w=1200');background-size:cover;">
      <div class="auth-left-content">
        <h2>Start Your Journey</h2>
        <p>Join thousands of happy travelers who explore<br>India's finest destinations with TravelVista.</p>
      </div>
    </div>

    <!-- Right: Register Form -->
    <div class="auth-right">
      <!-- Logo -->
      <div class="auth-logo">
        <i class="bi bi-airplane-fill"></i> TravelVista
      </div>

      <h1 class="auth-title">Create account</h1>
      <p class="auth-subtitle">Register to start exploring amazing destinations</p>

      <!-- Error / Success Messages -->
      <div class="alert-error" id="reg-error"><i class="bi bi-exclamation-circle me-2"></i><span id="error-msg"></span></div>
      <div class="alert-success" id="reg-success"><i class="bi bi-check-circle me-2"></i><span id="success-msg"></span></div>

      <!-- Registration Form -->
      <form id="register-form" novalidate>
        <!-- Name -->
        <div class="mb-3">
          <label class="form-label" for="name">Full Name</label>
          <div class="input-wrapper">
            <i class="bi bi-person input-icon"></i>
            <input type="text" class="form-control" id="name" placeholder="Your full name" required>
          </div>
        </div>

        <!-- Email -->
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <div class="input-wrapper">
            <i class="bi bi-envelope input-icon"></i>
            <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
          </div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <i class="bi bi-lock input-icon"></i>
            <input type="password" class="form-control" id="password" placeholder="Minimum 6 characters" required minlength="6">
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="mb-4">
          <label class="form-label" for="confirm-password">Confirm Password</label>
          <div class="input-wrapper">
            <i class="bi bi-shield-lock input-icon"></i>
            <input type="password" class="form-control" id="confirm-password" placeholder="Re-enter your password" required>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-primary-custom w-100 justify-content-center" style="padding:0.85rem; margin-top: 0.5rem;">
          Create Account
        </button>
      </form>

      <!-- Redirect to Login -->
      <div class="auth-link">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    // Redirect if already logged in
    redirectIfLoggedIn();

    // Handle registration form submission
    document.getElementById('register-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm-password').value;

      const errEl  = document.getElementById('reg-error');
      const succEl = document.getElementById('reg-success');
      errEl.style.display = 'none';
      succEl.style.display = 'none';

      // Validate inputs
      if (!name || !email || !password || !confirm) {
        document.getElementById('error-msg').textContent = 'Please fill in all fields.';
        errEl.style.display = 'block'; return;
      }
      if (password.length < 6) {
        document.getElementById('error-msg').textContent = 'Password must be at least 6 characters.';
        errEl.style.display = 'block'; return;
      }
      if (password !== confirm) {
        document.getElementById('error-msg').textContent = 'Passwords do not match.';
        errEl.style.display = 'block'; return;
      }

      const result = registerUser(name, email, password);
      if (result.success) {
        document.getElementById('success-msg').textContent = result.message;
        succEl.style.display = 'block';
        document.getElementById('register-form').reset();
        setTimeout(() => { window.location.href = 'login.html'; }, 2000);
      } else {
        document.getElementById('error-msg').textContent = result.message;
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
